<h3>2. Libreta de Clientes Registrados</h3>
<mat-card appearance="outlined">
  @if (clientes().length) {
    <table mat-table [dataSource]="clientes()">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let c">{{ c.nombre }}</td>
      </ng-container>
      <ng-container matColumnDef="whatsapp">
        <th mat-header-cell *matHeaderCellDef>WhatsApp</th>
        <td mat-cell *matCellDef="let c">{{ c.whatsapp }}</td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let c">{{ c.email }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let fila; columns: columnas"></tr>
    </table>
  } @else {
    <app-empty-state icono="groups" mensaje="Todavía no hay clientes registrados." />
  }
</mat-card>
