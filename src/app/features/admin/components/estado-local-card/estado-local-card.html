<mat-card appearance="outlined">
  <mat-card-content class="contenido">
    <div>
      <h4>Estado del Local en la Web</h4>
      <p>Cambiá el cartel superior en un clic según el momento del día.</p>
    </div>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-select [value]="estado.estado()" (selectionChange)="cambiar($event.value)" aria-label="Estado del local">
        @for (o of opciones; track o.valor) {
          <mat-option [value]="o.valor">{{ o.emoji }} {{ o.etiqueta }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </mat-card-content>
</mat-card>
