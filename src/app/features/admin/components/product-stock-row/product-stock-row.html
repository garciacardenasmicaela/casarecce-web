<img class="foto" loading="lazy" decoding="async" [src]="producto().imagen_url || imagenPorDefecto" appImgFallback [alt]="producto().nombre">

<div class="datos">
  <p class="nombre">{{ producto().nombre }}</p>
  <p class="detalle">{{ producto().porciones }}</p>
</div>

<mat-form-field appearance="outline" subscriptSizing="dynamic" class="precio">
  <span matTextPrefix>$&nbsp;</span>
  <input matInput type="number" min="1" [value]="producto().precio" (change)="alCambiarPrecio($event)" aria-label="Precio">
</mat-form-field>

<app-qty-stepper [cantidad]="producto().stock" [editable]="true" sufijo="u."
                 (cambiar)="stockAjustado.emit($event)" (fijar)="stockFijado.emit($event)" />

<button mat-stroked-button class="estado" [class.agotado]="producto().stock === 0" (click)="stockAlternado.emit()">
  {{ producto().stock > 0 ? 'Disponible' : 'Agotado (0 u.)' }}
</button>
