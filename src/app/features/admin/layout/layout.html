<mat-toolbar class="header">
  <div class="interior">
    <nav class="nav" aria-label="Secciones del panel">
      @for (p of pestanas; track p.ruta) {
        <a mat-button [routerLink]="p.ruta" routerLinkActive="activo">
          <mat-icon>{{ p.icono }}</mat-icon>{{ p.texto }}
        </a>
      }
    </nav>

    <a routerLink="/admin" class="logo" aria-label="Panel de control Casarecce">
      <app-brand-logo />
    </a>

    <div class="acciones">
      <a mat-stroked-button routerLink="/" class="ver-sitio">
        <mat-icon>storefront</mat-icon><span class="texto-btn">Ver sitio</span>
      </a>
      <button mat-flat-button class="salir" (click)="salir()">
        <mat-icon>logout</mat-icon><span class="texto-btn">Salir</span>
      </button>
    </div>
  </div>

  <!-- Celular / tablet: las secciones pasan a una franja debajo del logo -->
  <nav class="nav-movil" aria-label="Secciones del panel">
    @for (p of pestanas; track p.ruta) {
      <a mat-button [routerLink]="p.ruta" routerLinkActive="activo">
        <mat-icon>{{ p.icono }}</mat-icon>{{ p.texto }}
      </a>
    }
  </nav>
</mat-toolbar>

<main class="contenido">
  <router-outlet />
</main>
