<mat-toolbar class="barra">
  <div class="interior">
    <app-brand-monogram [tamano]="38" />
    <div class="titulos">
      <span class="titulo">Panel de Control</span>
      <span class="subtitulo">Stock por unidades, precios, clientes y novedades</span>
    </div>
    <a mat-button routerLink="/"><mat-icon>storefront</mat-icon><span class="texto-btn">Ver sitio</span></a>
    <button mat-button (click)="salir()"><mat-icon>logout</mat-icon><span class="texto-btn">Salir</span></button>
  </div>
</mat-toolbar>

<div class="navegacion">
  <nav mat-tab-nav-bar [tabPanel]="panel" class="pestanas" mat-stretch-tabs="false" mat-align-tabs="start">
    @for (p of pestanas; track p.ruta) {
      <a mat-tab-link [routerLink]="p.ruta" routerLinkActive #rla="routerLinkActive" [active]="rla.isActive">
        <mat-icon>{{ p.icono }}</mat-icon>{{ p.texto }}
      </a>
    }
  </nav>
</div>

<mat-tab-nav-panel #panel class="contenido">
  <router-outlet />
</mat-tab-nav-panel>
