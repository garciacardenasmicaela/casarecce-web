<mat-card class="tarjeta">
  <app-brand-logo />
  <h2>Panel de Control</h2>

  <form [formGroup]="form" (ngSubmit)="ingresar()">
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="username">
      <mat-error>Ingresá un email válido</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password">
      <mat-error>Ingresá tu contraseña</mat-error>
    </mat-form-field>

    @if (error()) { <p class="error">{{ error() }}</p> }
    <button mat-flat-button type="submit" [disabled]="cargando()">Ingresar</button>
  </form>

  @if (modoDemo) {
    <p class="demo">Modo demo activo: <a routerLink="/admin">entrar sin login</a></p>
  }
  <a mat-button routerLink="/">Volver al sitio</a>
</mat-card>
