<h3>3. Enviar Novedad por Email en 1 Clic</h3>
<mat-card appearance="outlined">
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="enviar()">
      <mat-form-field appearance="outline">
        <mat-label>Título</mat-label>
        <input matInput formControlName="titulo" placeholder="¡Este domingo Sorrentinos de Salmón!">
        <mat-error>Escribí un título</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Mensaje corto para toda tu base de clientes</mat-label>
        <textarea matInput rows="4" formControlName="mensaje"></textarea>
        <mat-error>Escribí un mensaje</mat-error>
      </mat-form-field>
      <button mat-flat-button type="submit"><mat-icon>send</mat-icon> Enviar Novedad a Clientes</button>
    </form>
  </mat-card-content>
</mat-card>
