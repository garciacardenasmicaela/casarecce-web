<header class="cabecera">
  <span class="icono"><mat-icon>shopping_bag</mat-icon></span>
  <div class="titulos">
    <h2 mat-dialog-title>Tu Pedido</h2>
    <p>Armá tu pedido y envialo por WhatsApp</p>
  </div>
  <button mat-flat-button class="beneficio" [class.activo]="clientes.descuentoActivo()"
          [disabled]="clientes.descuentoActivo()" (click)="activarDescuento()">
    {{ clientes.descuentoActivo() ? 'Activo ✓' : '10% OFF' }}
  </button>
  <button mat-icon-button mat-dialog-close aria-label="Cerrar"><mat-icon>close</mat-icon></button>
</header>

<div class="cuerpo">
  @if (cart.vacio()) {
    <app-empty-state icono="shopping_basket" mensaje="Tu carrito está vacío"
      detalle="Elegí tus pastas frescas, tartas o dulces del catálogo para armar tu pedido." />
  } @else {
    <div class="lista">
      @for (item of cart.items(); track item.producto.id) {
        <app-carrito-item [item]="item" (cambiar)="cart.cambiarCantidad(item.producto.id, $event)" />
      }
    </div>
    <app-checkout-form />
  }
</div>

@if (!cart.vacio()) {
  <footer class="pie">
    <app-carrito-totales [subtotal]="cart.subtotal()" [descuento]="cart.descuento()" [total]="cart.total()" />
    <button mat-flat-button class="enviar" (click)="enviar()">
      <mat-icon fontSet="fa-brands" fontIcon="fa-whatsapp" /> Enviar Pedido por WhatsApp
    </button>
  </footer>
}
