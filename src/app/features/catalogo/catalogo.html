<div class="cabecera">
  <app-section-header
    eyebrow="Elaboración Artesanal"
    [titulo]="catalogo.tituloActual()"
    subtitulo="Todas nuestras opciones detallan cuántas porciones rinden y su stock disponible hoy." />

  @if (descuento.activo()) {
    <mat-chip class="descuento"><mat-icon matChipAvatar>check_circle</mat-icon> Beneficio 10% OFF Activado</mat-chip>
  }
</div>

@if (catalogo.cargando()) {
  <mat-progress-bar mode="indeterminate" />
} @else if (catalogo.error()) {
  <div class="error-carga">
    <app-empty-state icono="wifi_off" mensaje="No pudimos cargar la carta"
      detalle="Revisá tu conexión a internet e intentá de nuevo." />
    <button mat-flat-button type="button" (click)="catalogo.cargar()"><mat-icon>refresh</mat-icon> Reintentar</button>
  </div>
} @else if (catalogo.visibles().length) {
  <div class="grilla">
    @for (p of catalogo.visibles(); track p.id) {
      <app-product-card [producto]="p" [categoria]="catalogo.nombreCategoria(p.categoria)" (agregar)="agregar($event)" />
    }
  </div>
} @else {
  <app-empty-state icono="restaurant_menu" mensaje="Por ahora no hay productos en esta categoría." />
}
