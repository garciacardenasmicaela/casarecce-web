<button mat-icon-button mat-dialog-close class="cerrar" aria-label="Cerrar"><mat-icon>close</mat-icon></button>

<div class="encabezado">
  <span class="insignia">10%</span>
  <span class="eyebrow">Beneficio de Bienvenida</span>
  <h2 mat-dialog-title>¡<em>10%</em> OFF en tu primera compra!</h2>
  <p class="detalle">
    Dejanos tu nombre, WhatsApp y correo para aplicar automáticamente el descuento en tu carrito.
  </p>
</div>

<form (ngSubmit)="aplicar()">
  <mat-dialog-content>
    <app-datos-cliente-fields [grupo]="form" />
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-flat-button type="submit" class="aplicar">Activar 10% OFF Ahora</button>
  </mat-dialog-actions>
</form>
