<mat-toolbar class="header">
  <div class="interior">
    <!-- Menú hamburguesa: enlaces (hasta lg) + acciones (solo en celular) -->
    <button mat-icon-button class="hamburguesa" [matMenuTriggerFor]="menu" aria-label="Abrir menú">
      <mat-icon [matBadge]="esMovil() ? cart.cantidad() : null" matBadgeSize="small"
                [matBadgeHidden]="!esMovil() || cart.cantidad() === 0">menu</mat-icon>
    </button>
    <mat-menu #menu="matMenu" class="menu-sitio">
      @for (e of enlaces; track e.fragmento) {
        <a mat-menu-item routerLink="/" [fragment]="e.fragmento">{{ e.texto }}</a>
      }
      @if (esMovil()) {
        <mat-divider />
        <button mat-menu-item (click)="dialogs.abrirCarrito()">
          <mat-icon>shopping_bag</mat-icon>
          <span>Mi Pedido ({{ cart.cantidad() }})</span>
        </button>
        <button mat-menu-item (click)="dialogs.abrirDescuento()">
          <mat-icon>{{ descuento.activo() ? 'check' : 'redeem' }}</mat-icon>
          <span>{{ descuento.activo() ? '10% Activo' : '10% OFF 1ª Compra' }}</span>
        </button>
        <a mat-menu-item routerLink="/admin">
          <mat-icon>manage_accounts</mat-icon>
          <span>Admin</span>
        </a>
      }
    </mat-menu>

    <nav class="nav">
      @for (e of enlaces; track e.fragmento) {
        <a mat-button routerLink="/" [fragment]="e.fragmento">{{ e.texto }}</a>
      }
    </nav>

    <a routerLink="/" class="logo" aria-label="Casarecce, inicio">
      <app-brand-logo />
    </a>

    @if (!esMovil()) {
      <div class="acciones">
        <button mat-flat-button class="descuento" [class.activo]="descuento.activo()"
                (click)="dialogs.abrirDescuento()">
          <mat-icon>{{ descuento.activo() ? "check" : "redeem" }}</mat-icon>
          @if (descuento.activo()) { 10% Activo } @else { 10% OFF 1ª Compra }
        </button>
        <a mat-stroked-button routerLink="/admin" class="admin">
          <mat-icon>manage_accounts</mat-icon>Admin
        </a>
        <button mat-flat-button class="pedido" (click)="dialogs.abrirCarrito()">
          <mat-icon>shopping_bag</mat-icon>
          Mi Pedido
          <span class="contador">{{ cart.cantidad() }}</span>
        </button>
      </div>
    } @else {
      <!-- Equilibra el logo al centro en celular -->
      <span class="espaciador"></span>
    }
  </div>
</mat-toolbar>
