<mat-toolbar class="header">
  <div class="interior">
    <nav class="nav">
      @for (e of enlaces; track e.fragmento) {
        <a mat-button routerLink="/" [fragment]="e.fragmento">{{ e.texto }}</a>
      }
    </nav>

    <a routerLink="/" class="logo" aria-label="Casarecce, inicio">
      <app-brand-logo />
    </a>

    <div class="acciones">
      <button mat-flat-button class="descuento" [class.activo]="clientes.descuentoActivo()"
              (click)="dialogs.abrirDescuento()">
        <mat-icon>{{ clientes.descuentoActivo() ? "check" : "redeem" }}</mat-icon>
        @if (clientes.descuentoActivo()) { 10% Activo } @else { 10% OFF <span class="solo-sm">1ª Compra</span> }
      </button>
      <a mat-stroked-button routerLink="/admin" class="admin">
        <mat-icon>manage_accounts</mat-icon><span class="solo-md">Admin</span>
      </a>
      <button mat-flat-button class="pedido" (click)="dialogs.abrirCarrito()">
        <mat-icon>shopping_bag</mat-icon>
        <span class="solo-sm">Mi Pedido</span>
        <span class="contador">{{ cart.cantidad() }}</span>
      </button>
    </div>
  </div>
</mat-toolbar>
