<div [formGroup]="grupo()" class="campos" [class.compacto]="compacto()">
  <mat-form-field appearance="outline" class="nombre">
    <mat-label>Nombre y apellido</mat-label>
    <input matInput formControlName="nombre" autocomplete="name">
    <mat-error>Ingresá tu nombre</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>WhatsApp</mat-label>
    <input matInput type="tel" formControlName="whatsapp" placeholder="381..." autocomplete="tel">
    <mat-error>Ingresá tu WhatsApp</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Email</mat-label>
    <input matInput type="email" formControlName="email" autocomplete="email">
    <mat-error>Ingresá un email válido</mat-error>
  </mat-form-field>
</div>
