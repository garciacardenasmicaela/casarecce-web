<mat-card class="tarjeta" [class.agotado]="!producto().disponible">
  <div class="foto">
    <img [src]="producto().imagen_url || imagenPorDefecto" appImgFallback
         [alt]="producto().nombre">
    <span class="porciones">{{ producto().porciones }}</span>
    @if (!producto().disponible) {
      <div class="velo"><span class="sello">Agotado por hoy</span></div>
    }
  </div>

  <mat-card-content class="cuerpo">
    @if (categoria()) { <span class="categoria">{{ categoria() }}</span> }
    <h3>{{ producto().nombre }}</h3>
    <p>{{ producto().descripcion }}</p>
  </mat-card-content>

  <mat-card-actions class="pie">
    <span class="precio">{{ producto().precio | precio }}</span>
    @if (producto().disponible) {
      <button mat-flat-button (click)="agregar.emit(producto())">
        <mat-icon>add</mat-icon> Agregar
      </button>
    } @else {
      <button mat-flat-button disabled>Sin stock hoy</button>
    }
  </mat-card-actions>
</mat-card>
